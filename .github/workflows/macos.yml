name: macOS build

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install librime glog leveldb marisa opencc yaml-cpp snappy gflags

    - name: Run Tests
      run: |
        cd Sources/OpenKey/macOS
        xcodebuild test -project OpenKey.xcodeproj -scheme LibreKey -destination 'platform=macOS,arch=arm64'

    - name: Build Release
      run: |
        cd Sources/OpenKey/macOS
        xcodebuild -project OpenKey.xcodeproj -scheme LibreKey -configuration Release -derivedDataPath build -arch arm64 build

    - name: Bundle Frameworks & Package
      run: |
        APP_PATH="Sources/OpenKey/macOS/build/Build/Products/Release/LibreKey.app"
        if [ ! -d "$APP_PATH" ]; then
          echo "Error: LibreKey.app not found at $APP_PATH"
          exit 1
        fi
        echo "Found LibreKey.app at $APP_PATH"
        chmod +x Sources/OpenKey/macOS/Tools/bundle_frameworks.sh
        Sources/OpenKey/macOS/Tools/bundle_frameworks.sh "$APP_PATH"
        mkdir -p dist
        cd Sources/OpenKey/macOS/build/Build/Products/Release
        zip -r -y "${GITHUB_WORKSPACE}/dist/LibreKey-macOS.zip" LibreKey.app

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LibreKey-macOS
        path: dist/LibreKey-macOS.zip

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'

    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: LibreKey-macOS

    - name: Attach to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag="${GITHUB_REF_NAME}"
        if [ "$GITHUB_EVENT_NAME" = "release" ]; then
          tag="${{ github.event.release.tag_name }}"
        fi
        version="${tag#v}"
        cp LibreKey-macOS.zip "LibreKey-${version}-macOS.zip"
        gh release upload "$tag" \
          "LibreKey-${version}-macOS.zip" \
          LibreKey-macOS.zip \
          --repo "$GITHUB_REPOSITORY" --clobber
