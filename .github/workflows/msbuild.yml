name: Windows build

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: .\Sources\OpenKey\win32\OpenKey
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build x86
      run: msbuild -m -target:Rebuild -p:Configuration=${{env.BUILD_CONFIGURATION}} -p:Platform=x86 ${{env.SOLUTION_FILE_PATH}}

    - name: Build x64
      run: msbuild -m -target:Rebuild -p:Configuration=${{env.BUILD_CONFIGURATION}} -p:Platform=x64 ${{env.SOLUTION_FILE_PATH}}

    # The rebrand renamed the output binaries. If these are missing the build
    # silently produced something under the old name, so fail loudly here
    # rather than shipping an empty archive.
    - name: Check the expected binaries exist
      shell: pwsh
      run: |
        $expected = @(
          "${{env.SOLUTION_FILE_PATH}}\Release\LibreKey32.exe",
          "${{env.SOLUTION_FILE_PATH}}\x64\Release\LibreKey64.exe"
        )
        $missing = $expected | Where-Object { -not (Test-Path $_) }
        if ($missing) {
          Write-Error "Không thấy binary: $($missing -join ', ')"
          exit 1
        }
        $expected | ForEach-Object { Write-Host "OK $_ ($((Get-Item $_).Length) bytes)" }

    - name: Collect the binaries
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        Copy-Item "${{env.SOLUTION_FILE_PATH}}\Release\LibreKey32.exe" dist\
        Copy-Item "${{env.SOLUTION_FILE_PATH}}\x64\Release\LibreKey64.exe" dist\
        Compress-Archive -Path dist\* -DestinationPath LibreKey-windows.zip

    - name: Upload a Build Artifact
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: LibreKey-windows
        path: LibreKey-windows.zip

    outputs:
      subject-name: LibreKey-windows
      subject-digest: ${{steps.upload.outputs.artifact-digest}}

  attest:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v2
      with:
        subject-name: ${{needs.build.outputs.subject-name}}
        subject-digest: sha256:${{needs.build.outputs.subject-digest}}

  # Only on a v* tag: attach the archive to the matching GitHub release.
  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: LibreKey-windows

    - name: Attach to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mv LibreKey-windows.zip "LibreKey-${GITHUB_REF_NAME#v}-windows.zip"
        gh release upload "$GITHUB_REF_NAME" \
          "LibreKey-${GITHUB_REF_NAME#v}-windows.zip" \
          --repo "$GITHUB_REPOSITORY" --clobber
